<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노꽁 — 네이버 지도 진단</title>
<style>
  body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;margin:0;background:#fff;color:#1B1F23}
  h1{font-size:18px;margin:0;padding:12px 16px;background:#1F2A33;color:#fff}
  #m{height:320px;background:#DDE3E8;border-bottom:1px solid #C9D1D8}
  #out{margin:0;padding:12px 16px;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  #sum{margin:0 16px 8px;padding:12px 14px;border-radius:10px;background:#FFF1E0;font-size:16px;font-weight:700;line-height:1.5;white-space:pre-wrap}
  .ok{color:#1E6B3A}.bad{color:#B3261E}
  .bar{padding:8px 16px 16px;font-size:14px;line-height:1.8}
  .bar a{margin-right:14px}
  button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #C9D1D8;background:#fff;cursor:pointer}
</style>
</head>
<body>
<h1>노꽁 네이버 지도 진단 (test-naver.html)</h1>
<div id="m"></div>
<div id="sum">진단 중… 12초만 기다리세요.</div>
<pre id="out"></pre>
<div class="bar">
  <button id="copy">결과 복사</button>
  <a id="alt" href="#">키 파라미터를 ncpClientId로 다시 시험</a>
  <a id="meta" href="#">index.html과 같은 meta(referrer·CSP) 붙여서 다시 시험</a>
</div>
<script>
(function () {
  // 설정: app.js 와 같은 키. 주소 뒤에 ?p=ncpClientId 를 붙이면 옛 파라미터로, ?meta=1 을 붙이면 index.html 의 meta 2개를 넣고 시험합니다.
  var KEY = "wces4uwwx1";
  var q = new URLSearchParams(location.search);
  var PARAM = q.get("p") === "ncpClientId" ? "ncpClientId" : "ncpKeyId";
  var META = q.get("meta") === "1";
  var SDK = "https://oapi.map.naver.com/openapi/v3/maps.js?" + PARAM + "=" + KEY;

  var out = document.getElementById("out"), sum = document.getElementById("sum");
  var t0 = Date.now(), lines = [];
  function log(s) { lines.push("+" + String(Date.now() - t0).padStart(5) + "ms  " + s); out.textContent = lines.join("\n"); }
  var state = { scriptOk: null, mapsAtLoad: null, authFail: null, mapCreated: null, init: null, tilesloaded: null, consoleMsgs: [], jsErrors: [] };

  // 네이버 SDK 가 콘솔에 찍는 메시지(인증 실패 문구에 Client ID 와 URI 가 들어 있음)를 화면에도 보여 줍니다.
  ["error", "warn", "info", "log"].forEach(function (k) {
    var orig = console[k];
    console[k] = function () {
      var msg = Array.prototype.map.call(arguments, function (a) { try { return typeof a === "string" ? a : JSON.stringify(a); } catch (e) { return String(a); } }).join(" ");
      state.consoleMsgs.push(k + ": " + msg); log("console." + k + " → " + msg);
      try { orig.apply(console, arguments); } catch (e) {}
    };
  });
  window.addEventListener("error", function (e) { state.jsErrors.push(e.message); log("JS 오류 → " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")"); });
  window.addEventListener("unhandledrejection", function (e) { state.jsErrors.push(String(e.reason)); log("Promise 오류 → " + String(e.reason)); });

  if (META) {
    var m1 = document.createElement("meta"); m1.name = "referrer"; m1.content = "strict-origin-when-cross-origin"; document.head.appendChild(m1);
    var m2 = document.createElement("meta"); m2.httpEquiv = "Content-Security-Policy"; m2.content = "object-src 'none'; base-uri 'self'; form-action 'self'"; document.head.appendChild(m2);
    log("index.html 과 같은 meta 2개 적용 (referrer, CSP)");
  }
  log("페이지 주소: " + location.href);
  log("브라우저: " + navigator.userAgent.replace(/^.*\) /, "").slice(0, 80));
  log("SDK 주소: " + SDK);

  window.navermap_authFailure = function () {
    state.authFail = Date.now() - t0;
    log("★ navermap_authFailure 호출됨 → NCP 가 이 도메인/키를 거부 (인증 실패)");
  };

  var s = document.createElement("script"); s.src = SDK; s.async = true;
  s.onerror = function () { state.scriptOk = false; log("★ SDK 다운로드 실패 (네트워크 차단·오프라인·광고차단기)"); finish(); };
  s.onload = function () {
    state.scriptOk = true;
    state.mapsAtLoad = !!(window.naver && window.naver.maps && window.naver.maps.Map);
    log("SDK 다운로드 성공. naver.maps.Map 존재: " + state.mapsAtLoad);
    [1000, 3000, 6000].forEach(function (ms) {
      setTimeout(function () { log("+" + ms / 1000 + "초 뒤 naver.maps = " + (window.naver && window.naver.maps ? "있음" : "없음(null) ← 인증 실패 시 SDK 가 비움")); }, ms);
    });
    var tries = 0;
    (function wait() {
      if (window.naver && window.naver.maps && window.naver.maps.Map) return makeMap();
      if (++tries > 40) { log("★ 8초 동안 naver.maps.Map 이 생기지 않음"); return finish(); }
      setTimeout(wait, 200);
    })();
  };
  document.head.appendChild(s);
  log("SDK 요청 시작");

  function makeMap() {
    try {
      var N = window.naver.maps;
      var map = new N.Map(document.getElementById("m"), { center: new N.LatLng(37.6255, 127.08), zoom: 15, zoomControl: true });
      state.mapCreated = Date.now() - t0;
      log("지도 객체 생성 성공");
      N.Event.addListener(map, "init", function () { state.init = Date.now() - t0; log("이벤트 init 수신"); });
      N.Event.addListener(map, "tilesloaded", function () { if (state.tilesloaded == null) { state.tilesloaded = Date.now() - t0; log("이벤트 tilesloaded 수신 (타일이 그려짐)"); } });
    } catch (e) {
      log("★ 지도 생성 중 오류: " + e.message);
    }
    setTimeout(finish, 10000);
  }

  var done = false;
  function finish() {
    if (done) return; done = true;
    var el = document.getElementById("m");
    var imgs = Array.prototype.slice.call(el.querySelectorAll("img"));
    var loaded = imgs.filter(function (i) { return i.complete && i.naturalWidth > 0; });
    var hosts = {}; imgs.forEach(function (i) { try { hosts[new URL(i.src).host] = (hosts[new URL(i.src).host] || 0) + 1; } catch (e) {} });
    log("컨테이너 안 이미지 " + imgs.length + "개, 그중 로드 완료 " + loaded.length + "개. 출처: " + (JSON.stringify(hosts) || "{}"));
    log("컨테이너 크기: " + el.clientWidth + "×" + el.clientHeight + "px");

    var verdict, cls = "bad";
    if (state.authFail != null) {
      verdict = "결론: NCP 인증 실패(도메인 또는 키 거부).\n위 console.error 줄의 'URI:' 값이 NCP 콘솔 Web 서비스 URL(" + location.origin + ")과 같은 도메인인지 확인. 방금 등록·수정했다면 5분 뒤 다시 열기. 그래도 같으면 ncpClientId 링크로 한 번 더.";
    } else if (state.scriptOk === false) {
      verdict = "결론: SDK 파일 자체를 못 받음.\n네트워크·광고차단 확장프로그램·학교 와이파이 차단 가능성. 다른 네트워크(휴대폰 핫스팟)에서 다시 열어 보기.";
    } else if (!state.mapCreated) {
      verdict = "결론: SDK 는 받았지만 지도 객체가 안 생김.\n키 파라미터 이름 문제일 수 있음 → 아래 'ncpClientId' 링크로 다시 시험.";
    } else if (state.tilesloaded != null || loaded.length > 0) {
      verdict = "결론: 네이버 지도 정상 ✅ (인증 통과, 타일 " + loaded.length + "개 그려짐).\n그렇다면 문제는 index.html/app.js 쪽. 아래 'meta 붙여서' 링크도 정상이면 app.js 로직 문제 → 이 화면 그대로 보내 주기."; cls = "ok";
    } else {
      verdict = "결론: 인증은 통과했는데 타일이 안 그려짐.\n타일 서버(*.pstatic.net) 차단이나 네트워크 문제. 다른 네트워크에서 다시 열어 보기.";
    }
    sum.textContent = verdict; sum.className = cls;
    log("=== 진단 끝 ===");
  }

  document.getElementById("copy").onclick = function () {
    var txt = sum.textContent + "\n\n" + lines.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { this_ok(); }, fallback); else fallback();
    function this_ok() { document.getElementById("copy").textContent = "복사됨 — 채팅에 붙여넣기"; }
    function fallback() { var r = document.createRange(); r.selectNodeContents(out); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.getElementById("copy").textContent = "선택됨 — Ctrl+C 로 복사"; }
  };
  document.getElementById("alt").href = location.pathname + "?p=ncpClientId" + (META ? "&meta=1" : "");
  document.getElementById("meta").href = location.pathname + "?meta=1" + (PARAM === "ncpClientId" ? "&p=ncpClientId" : "");
})();
</script>
</body>
</html>
